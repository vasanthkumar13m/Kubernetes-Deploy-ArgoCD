apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: my-daemonset
spec:
  selector:
    matchLabels:
      app: my-app-daemon
  
  template:
    metadata:
      labels:
        app: my-app-daemon
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80